<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nightcap</title>
<meta name="description" content="Switches Night Shift off for chosen apps and websites on macOS.">
<style>
  :root { color-scheme: light dark; --bg: #fbfaf7; --fg: #1d1b18; --muted: #6b665e; --link: #8a4b0f; }
  @media (prefers-color-scheme: dark) { :root { --bg: #16140f; --fg: #ece7dd; --muted: #a39d92; --link: #f0a65a; } }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 17px/1.55 -apple-system, system-ui, sans-serif; }
  main { max-width: 34rem; margin: 18vh auto; padding: 0 16px; }
  h1 { font-size: 2rem; margin: 0 0 .25rem; }
  p { margin: .5rem 0; }
  .muted { color: var(--muted); }
  a { color: var(--link); }
</style>
</head>
<body>
<main>
  <h1>Nightcap</h1>
  <p>Switches Night Shift off for chosen apps and websites on macOS.</p>
  <p class="muted">The site is on its way. Until then, everything lives on <a href="https://github.com/choco/nightcap">GitHub</a>.</p>
</main>
</body>
</html>
