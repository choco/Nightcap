<!-- @dsCard group="Status" height=112 subtitle="The app's four check states" -->
<style>
  /* The app draws these; the site has none, so the card draws them itself. */
  .nc-mark { display: inline-flex; align-items: center; gap: var(--space-2); font: 500 14px/1.3 var(--font-text); color: var(--ink); }
  .nc-mark svg { width: 18px; height: 18px; flex: none; }
  .nc-mark--ok svg { color: var(--ok); }
  .nc-mark--drift svg { color: var(--drift); }
  .nc-mark--broken svg { color: var(--broken); }
  .nc-mark--off svg { color: var(--off); }
</style>
<div style="background:var(--ground);display:flex;flex-wrap:wrap;gap:var(--space-4) var(--space-8);padding:var(--space-6) var(--space-4)">
  <span class="nc-mark nc-mark--ok">
    <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="10" fill="currentColor"/><path d="m7.5 12.2 3 3 6-6.4" fill="none" stroke="var(--ground)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
    Notifications allowed
  </span>
  <span class="nc-mark nc-mark--drift">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2.6 22.4 20.6H1.6Z" fill="currentColor" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/><path d="M12 9v5" stroke="var(--ground)" stroke-width="2.2" stroke-linecap="round"/><circle cx="12" cy="17.3" r="1.25" fill="var(--ground)"/></svg>
    Accessibility switched off
  </span>
  <span class="nc-mark nc-mark--broken">
    <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="10" fill="currentColor"/><path d="m8.5 8.5 7 7m0-7-7 7" stroke="var(--ground)" stroke-width="2.2" stroke-linecap="round"/></svg>
    Config has an error
  </span>
  <span class="nc-mark nc-mark--off">
    <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="2"/><path d="M8 12h8" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
    Website checking off
  </span>
</div>
