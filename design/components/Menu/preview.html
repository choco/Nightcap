<!-- @dsCard group="Product" height=330 subtitle="In macOS's look over Figma, and as a night panel over Safari" -->
<div id="card" style="display:flex;flex-wrap:wrap;gap:var(--space-6);align-items:flex-start;padding:var(--space-6);background:var(--ground)"></div>
<script>
const h = React.createElement;
const { Menu, MENUS } = Nightcap;
// macOS's look takes the system's face and 13px text from the mock it hangs in.
const mac = { padding: "var(--space-4)", borderRadius: "var(--radius-md)", background: "var(--scene-wall)", color: "var(--scene-ink)", font: '13px -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", sans-serif', WebkitFontSmoothing: "antialiased" };
ReactDOM.createRoot(document.getElementById("card")).render([
  h("div", { key: "mac", style: mac }, h(Menu, { look: "mac", entries: MENUS.figma })),
  h(Menu, { key: "night", look: "night", entries: MENUS.safari, style: { width: 248 } }),
]);
</script>
