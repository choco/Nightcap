<!-- @dsCard group="Content" height=300 subtitle="The CLI, with its real output" -->
<div id="card" style="padding:var(--space-6);background:var(--ground)"></div>
<script>
const h = React.createElement;
const { Terminal, Command, Output, Arg, State } = Nightcap;
ReactDOM.createRoot(document.getElementById("card")).render(
  h(Terminal, { "aria-label": "A terminal session with the nightcap command" },
    h(Command, null, " off ", h(Arg, null, "--for 1h30m")),
    h(Output, null, "Night Shift ", h(State), " until 01:00"),
    h(Command, null, " rules add ", h(Arg, null, "domain:figma.com")),
    h(Output, null, "Added domain:figma.com, which turns Night Shift off. Night Shift ", h(State), " until 01:00."),
    h(Command, null, " reset"),
    h(Output, null, "Night Shift following the schedule"),
    h(Command, null, " status ", h(Arg, null, "--json"), " | jq -r ", h(Arg, null, ".front.decision.state")),
    h(Output, null, h(State, { on: true })),
  ),
);
</script>
