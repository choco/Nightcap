name: pages

on:
  push:
    branches: [main]
    paths: ["site/**", "design/**", "scripts/build-site", ".github/workflows/pages.yml"]
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Assemble the site and the newest release's appcast
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          scripts/build-site
          tag="$(gh release list --repo "$GITHUB_REPOSITORY" --limit 1 --json tagName --jq '.[].tagName')"
          if [[ -n "$tag" ]]; then
            assets="$(gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name')"
            if grep -qx appcast.xml <<<"$assets"; then
              gh release download "$tag" --repo "$GITHUB_REPOSITORY" --pattern appcast.xml --dir build/site
            else
              echo "::notice::the newest release predates Sparkle and has no appcast.xml"
            fi
            # The site's download buttons: the DMG, or the zip of a release that has none.
            gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json assets --jq \
              '([.assets[] | select(.name | endswith(".dmg"))] + [.assets[] | select(.name | endswith(".zip"))])[0]
               | {version: ("'"${tag#v}"'"), url: .url}' > build/site/download.json
          fi
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: build/site
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
