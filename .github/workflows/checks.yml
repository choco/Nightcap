name: checks

on:
  # Dependabot's branches run as pull requests alone, behind the gate below.
  push:
    branches-ignore: ["dependabot/**"]
    paths: ["**", "!docs/**", "!**.md", "CHANGELOG.md"]
  pull_request:
    types: [opened, synchronize, reopened, labeled]
    paths: ["**", "!docs/**", "!**.md", "CHANGELOG.md"]
  workflow_call:

permissions:
  contents: read

jobs:
  # A Dependabot pull request runs its checks only once it has the `ci` label, so an update is
  # looked at before its code runs; adding the label starts the run, and later pushes to the
  # pull request run as any other. Adding any other label runs nothing.
  gate:
    if: >-
      github.event_name != 'pull_request'
      || (github.event.action != 'labeled' || github.event.label.name == 'ci')
      && (github.event.pull_request.user.login != 'dependabot[bot]'
        || contains(github.event.pull_request.labels.*.name, 'ci'))
    runs-on: ubuntu-24.04
    steps:
      - run: "true"

  rust:
    needs: gate
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: scripts/check --rust

  # The linters come from the flake, at the dev shell's versions.
  lint:
    needs: gate
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31.11.3
      - run: nix develop .#lint --command scripts/check --deps --scripts

  macos:
    needs: gate
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: sudo xcode-select --switch /Applications/Xcode_27.0.app
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      # Clippy and rustdoc reach the code behind cfg(target_os = "macos") only here. The Swift
      # checks build the debug core and the dev build, whose strings the catalog must hold.
      - run: scripts/check --rust --swift

  site:
    needs: gate
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: site/package.json
          cache: true
          cache_dependency_path: site/pnpm-lock.yaml
      - run: scripts/check --site
