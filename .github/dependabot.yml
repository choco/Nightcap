# Each ecosystem's updates come as one pull request a week, whose checks run once it has the
# `ci` label (checks.yml).
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns: ["*"]
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    groups:
      cargo:
        patterns: ["*"]
  - package-ecosystem: rust-toolchain
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: nix
    directory: /
    schedule:
      interval: weekly
    groups:
      nix:
        patterns: ["*"]
  # The site uses pnpm. Its pnpm-workspace.yaml takes only versions two weeks old, transitive ones
  # too, and CI's frozen install rejects a lockfile holding a younger one.
  - package-ecosystem: npm
    directory: /site
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
    groups:
      site:
        patterns: ["*"]
