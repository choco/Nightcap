<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <clipPath id="body">
      <rect x="100" y="100" width="824" height="824" rx="185"/>
    </clipPath>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5aa9e6"/>
      <stop offset="1" stop-color="#bfe3f5"/>
    </linearGradient>
    <filter id="drop" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>
  <!-- Tour Sample's poster (app/TourSample/main.swift), 440 points square, on macOS's icon grid. -->
  <rect x="100" y="100" width="824" height="824" rx="185" fill="#f7f3e8" filter="url(#drop)"/>
  <g clip-path="url(#body)">
    <g transform="translate(100 100) scale(1.872727)">
      <rect width="440" height="130" fill="url(#sky)"/>
      <circle cx="100" cy="110" r="60" fill="#2f6fe4"/>
      <circle cx="170" cy="170" r="60" fill="#e84f8a" style="mix-blend-mode: multiply"/>
      <g stroke="#000000" stroke-opacity="0.15" stroke-width="0.5">
        <rect x="376" y="30" width="34" height="34" rx="7" fill="#ffffff"/>
        <rect x="376" y="72" width="34" height="34" rx="7" fill="#2f6fe4"/>
        <rect x="376" y="114" width="34" height="34" rx="7" fill="#e84f8a"/>
        <rect x="376" y="156" width="34" height="34" rx="7" fill="#22b33a"/>
      </g>
    </g>
  </g>
</svg>
