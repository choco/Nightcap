[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "1.2.0"
edition = "2024"
license = "MIT"
publish = false

[workspace.dependencies]
clap = { version = "4.6", features = ["derive"] }
jiff = "0.2.38"
nightcap-protocol = { path = "crates/protocol" }
serde = "1.0.229"
serde_json = "1.0.154"
thiserror = "2.0.21"
uniffi = "0.32"

[workspace.lints.rust]
unsafe_code = "deny"
unreachable_pub = "warn"
missing_debug_implementations = "warn"
unused_qualifications = "warn"

[workspace.lints.clippy]
unwrap_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
as_conversions = "deny"
undocumented_unsafe_blocks = "deny"
allow_attributes_without_reason = "deny"
semicolon_if_nothing_returned = "warn"
uninlined_format_args = "warn"

# Rust panics can't cross the FFI boundary into Swift (ADR-0002).
[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
lto = true
