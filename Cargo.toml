[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "1.2.1"
edition = "2024"
license = "MIT"
publish = false

[workspace.dependencies]
anyhow = "1.0.104"
clap = { version = "4.6", features = ["derive"] }
etcetera = "0.11"
idna = "1.1.0"
jiff = "0.2.38"
libc = "0.2.190"
nightcap-core = { path = "crates/core" }
nightcap-protocol = { path = "crates/protocol" }
serde = "1.0.229"
serde_json = "1.0.154"
tempfile = "3.27.0"
thiserror = "2.0.21"
toml = "1.1.8"
tracing = "0.1.44"
tracing-oslog = { version = "0.3.0", default-features = false }
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["registry", "std"] }
uniffi = "0.32"

[workspace.lints.rust]
unsafe_code = "deny"
unreachable_pub = "warn"
missing_debug_implementations = "warn"
unused_qualifications = "warn"

[workspace.lints.clippy]
unwrap_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
as_conversions = "deny"
undocumented_unsafe_blocks = "deny"
allow_attributes_without_reason = "deny"
semicolon_if_nothing_returned = "warn"
uninlined_format_args = "warn"

# Rust panics can't cross the FFI boundary into Swift (ADR-0002).
[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
lto = true
